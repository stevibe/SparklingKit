<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>SparklingKit release distribution</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0b0d0e;
        color: #f2f4f5;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(36rem, calc(100% - 3rem));
      }

      p {
        color: #9ca3ad;
        line-height: 1.65;
      }

      a {
        color: #78dbc4;
      }

      code {
        color: #d7dce1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SparklingKit releases</h1>
      <p>This host serves verified SparklingKit installers and release assets.</p>
      <p><code>/stable/</code> follows the latest stable release. Versioned assets remain immutable.</p>
      <p><a href="https://www.sparklingkit.com/">Visit the SparklingKit website</a></p>
    </main>
  </body>
</html>
