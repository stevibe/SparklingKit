name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/stevibe/sparklingkit

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Validate source
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          package_version="$(node --print "require('./package.json').version")"
          if [[ "$release_version" != "$package_version" ]]; then
            printf 'Release tag %s does not match package.json version %s.\n' "$RELEASE_TAG" "$package_version" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=SparklingKit
            org.opencontainers.image.description=Local-first, file-oriented AI workspace
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and publish application image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Attest application image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Assemble release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          mkdir -p release-assets
          sed "s#ghcr.io/stevibe/sparklingkit:latest#ghcr.io/stevibe/sparklingkit:${release_version}#" distribution/compose.yaml > release-assets/compose.yaml
          cp distribution/sparklingkit release-assets/sparklingkit
          cp distribution/install.sh release-assets/install.sh
          cp distribution/dgx/install.sh release-assets/dgx-install.sh
          tar -czf release-assets/sparklingkit-dgx-stack.tar.gz \
            compose.yaml compose.spark.yaml compose.dgx.yaml LICENSE \
            scripts/start-dgx-models.sh scripts/start-dgx-spark.sh \
            services/dgx-models services/dgx-status
          cd release-assets
          sha256sum compose.yaml sparklingkit install.sh dgx-install.sh sparklingkit-dgx-stack.tar.gz > SHA256SUMS

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag \
            "${release_flags[@]}" \
            --generate-notes \
            --title "SparklingKit ${GITHUB_REF_NAME#v}"

  publish-run-site:
    needs: release
    uses: ./.github/workflows/publish-run-site.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read
      pages: write
      id-token: write
