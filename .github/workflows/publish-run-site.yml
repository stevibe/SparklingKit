name: Publish run.sparklingkit.com

on:
  push:
    branches:
      - main
    paths:
      - distribution/run-site/**
      - .github/workflows/publish-run-site.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable GitHub release tag to publish as stable
        required: true
        type: string
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.release_tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          release_tag="$REQUESTED_TAG"
          if [[ -z "$release_tag" ]]; then
            release_tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9] ]]; then
            printf 'Invalid release tag: %s\n' "$release_tag" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

      - name: Download attested release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          cd release-assets
          sha256sum --check SHA256SUMS

      - name: Assemble static distribution site
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p run-site/stable run-site/dgx/stable "run-site/v${version}" "run-site/dgx/v${version}"
          cp distribution/run-site/index.html distribution/run-site/CNAME run-site/
          cp release-assets/install.sh release-assets/compose.yaml release-assets/sparklingkit release-assets/SHA256SUMS run-site/stable/
          cp release-assets/install.sh release-assets/compose.yaml release-assets/sparklingkit release-assets/SHA256SUMS "run-site/v${version}/"
          printf '{"version":"%s"}\n' "$version" > run-site/stable/version.json
          cp run-site/stable/version.json "run-site/v${version}/version.json"
          cp release-assets/dgx-install.sh run-site/dgx/stable/install.sh
          cp release-assets/sparklingkit-dgx release-assets/sparklingkit-dgx-stack.tar.gz release-assets/SHA256SUMS run-site/dgx/stable/
          printf '{"version":"%s"}\n' "$version" > run-site/dgx/stable/version.json
          cp release-assets/dgx-install.sh "run-site/dgx/v${version}/install.sh"
          cp release-assets/sparklingkit-dgx release-assets/sparklingkit-dgx-stack.tar.gz release-assets/SHA256SUMS "run-site/dgx/v${version}/"
          cp run-site/dgx/stable/version.json "run-site/dgx/v${version}/version.json"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: run-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
